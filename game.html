<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFTER HOURS - Survival Horror</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Creepster&family=Henny+Penny&family=Cinzel:wght@600;800;900&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --night-black: #020608;
      --teal-mist: #16403d;
      --cyan-wisp: #4fffe3;
      --crimson-glow: #ff2a2a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--night-black);
      font-family: 'IM Fell English', serif;
      color: #cbd5e1;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #050508;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #game-container canvas {
      display: block;
      margin: 0 !important;
      max-width: 100vw;
      max-height: 100vh;
    }

    .font-creepy {
      font-family: 'Creepster', cursive;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    .font-codex {
      font-family: 'IM Fell English', serif;
    }

    .font-gothic-title {
      font-family: 'Henny Penny', cursive;
    }

    .glow-crimson {
      text-shadow: 0 0 10px #ff2a2a, 0 0 25px rgba(255, 42, 42, 0.75), 0 0 50px rgba(180, 0, 0, 0.5);
    }

    .parchment-frame {
      background: linear-gradient(135deg, rgba(3, 14, 16, 0.96) 0%, rgba(2, 6, 8, 0.98) 100%);
      border: 1px solid rgba(79, 255, 227, 0.35);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 35px rgba(22, 64, 61, 0.45);
    }

    .codex-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .codex-scroll::-webkit-scrollbar-track {
      background: #020608;
    }

    .codex-scroll::-webkit-scrollbar-thumb {
      background: #16403d;
      border-radius: 3px;
    }
  </style>
</head>

<body class="relative w-screen h-screen overflow-hidden bg-[#020608]">

  <!-- PHASER GAME CANVAS CONTAINER -->
  <div id="game-container"></div>

  <!-- Descent Transition -->
  <div id="descentOverlay"
    class="fixed inset-0 z-50 bg-[#020608] flex flex-col items-center justify-center text-center p-6 opacity-0 pointer-events-none transition-opacity duration-700">
    <div class="w-14 h-14 border-4 border-[#4fffe3] border-t-transparent rounded-full animate-spin mb-6"></div>
    <h2 class="font-gothic-title text-4xl sm:text-6xl text-[#f4efe4] tracking-widest mb-3">DESCENDING INTO THE ARCHIVES...</h2>
    <p class="font-codex text-sm text-[#4fffe3] max-w-md">Do not lose your way. The beast has caught your scent.</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
