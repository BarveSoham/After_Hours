<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFTER HOURS — Minimalist UI/UX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Henny+Penny&family=IM+Fell+English:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-abyss: #02050c;
      --bg-deep: #071020;
      --bg-mist: #162d4d;
      --bg-slate: #244670;
      --mist-mid: #4e7cab;
      --mist-light: #8cb2d6;
      --text-bone: #edf4fc;
      --accent-teal: #8fb8e0;
      --accent-crimson: #9e242e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-abyss);
      color: var(--text-bone);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .font-eerie {
      font-family: 'IM Fell English', 'Cormorant Garamond', serif;
    }

    .font-serif-clean {
      font-family: 'Cormorant Garamond', serif;
    }

    .font-mono-clean {
      font-family: 'JetBrains Mono', monospace;
    }

    .font-haunted {
      font-family: 'Henny Penny', 'IM Fell English', cursive;
      font-weight: 700;
      -webkit-text-stroke: 2.5px #edf4fc;
      paint-order: stroke fill;
    }

    /* High-Contrast Painterly & Engraved Glows */
    .glow-mist {
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.95),
        0 0 18px rgba(237, 244, 252, 0.72),
        0 0 42px rgba(140, 178, 214, 0.55);
    }

    .glow-teal {
      text-shadow:
        0 1px 6px rgba(2, 5, 12, 0.9),
        0 0 14px rgba(143, 184, 224, 0.65);
    }

    .glow-crimson {
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.95),
        0 0 22px rgba(158, 36, 46, 0.85),
        0 0 46px rgba(158, 36, 46, 0.45);
    }

    /* Floating Menu Links with Subtle Engraved Underline Accent */
    .float-link {
      position: relative;
      color: rgba(237, 244, 252, 0.84);
      text-shadow: 0 2px 8px rgba(2, 5, 12, 0.92);
      transition: all 0.25s ease;
      letter-spacing: 0.16em;
    }

    .float-link::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(237, 244, 252, 0.75), transparent);
      transform: translateX(-50%);
      transition: width 0.28s ease;
    }

    .float-link:hover,
    .float-link:focus {
      color: #ffffff;
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.98),
        0 0 16px rgba(237, 244, 252, 0.85),
        0 0 32px rgba(140, 178, 214, 0.6);
      transform: translateY(-1px);
    }

    .float-link:hover::after,
    .float-link:focus::after {
      width: 85%;
    }

    /* Minimal Hairline Toggle */
    .min-check {
      width: 14px;
      height: 14px;
      border: 1px solid rgba(110, 148, 184, 0.42);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .min-check.active {
      border-color: var(--accent-teal);
      background-color: rgba(122, 163, 204, 0.22);
      box-shadow: 0 0 10px rgba(122, 163, 204, 0.35);
    }

    .min-check.active::after {
      content: '';
      width: 6px;
      height: 6px;
      background-color: var(--text-bone);
    }

    /* Subtle Fade Entrance */
    @keyframes mistFadeIn {
      from {
        opacity: 0;
        filter: blur(3px);
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .screen-fade {
      animation: mistFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Gentle Continuous Title Bobbing */
    @keyframes titleBob {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .title-bob {
      animation: titleBob 4.2s ease-in-out infinite;
      will-change: transform;
    }

    /* Custom Minimal Range Slider */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(110, 148, 184, 0.22);
      height: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-bone);
      box-shadow: 0 0 8px rgba(220, 231, 245, 0.65);
      cursor: pointer;
    }
  </style>
</head>

  <!-- SUBTLE FLOATING FEEDBACK -->

  <script>
    /* ============================================================================
       MINIMAL APPLICATION STATE
    ============================================================================ */
    const state = {
      screen: 'MENU', // 'MENU' | 'LOBBY' | 'LOADING' | 'HUD' | 'SETTINGS' | 'HOW_TO_PLAY'
      lobby: {
        roomCode: 'AFH-409',
        players: [
          { id: 1, name: 'You', isSelf: true, ready: true, role: null, alive: true },
          { id: 2, name: 'Mirella', isSelf: false, ready: true, role: null, alive: true },
          { id: 3, name: 'Vesper', isSelf: false, ready: true, role: null, alive: true },
          { id: 4, name: 'Caleb', isSelf: false, ready: false, role: null, alive: true }
        ],
        extraNames: ['Soren', 'Isolde', 'Rowan', 'Evelyn']
      },
      match: {
        assignedRole: 'SURVIVOR',
        hudViewRole: 'SURVIVOR',
        tasksCompleted: 2,
        tasksTotal: 5,
        hunterNear: false,
        outcome: null
      },
      settings: {
        audio: {
          volume: 70
        }
      }
    };

    /* ============================================================================
       SUBTLE WEB AUDIO FEEDBACK & UI HELPERS
    ============================================================================ */
    let audioCtx = null;

    function playChime(type = 'hover') {
      try {
        const vol = (state.settings?.audio?.volume ?? 70) / 100;
        if (vol <= 0) return;

        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (type === 'hunter') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.45);
          gain.gain.setValueAtTime(0.08 * vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);
        } else if (type === 'select') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.16);
          gain.gain.setValueAtTime(0.06 * vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(360, now + 0.08);
          gain.gain.setValueAtTime(0.03 * vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      } catch (e) {
        // Ignore audio autoplay blocks gracefully
      }
    }

    function go(screenName) {
      playChime('select');
      state.screen = screenName;
      const vignette = document.getElementById('danger-vignette');
      if (vignette && screenName !== 'HUD') {
        vignette.style.opacity = '0';
      }
      render();
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      if (!backdrop || !content) return;
      content.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.innerHTML = `
        <div class="screen-fade px-5 py-2 bg-[#091324]/85 border border-[#436b95]/35 text-xs tracking-[0.25em] uppercase text-[#dce7f5] glow-teal">
          ${message}
        </div>
      `;
      setTimeout(() => {
        if (container) container.innerHTML = '';
      }, 2000);
    }

    function render() {
      const viewport = document.getElementById('app-viewport');
      const topLeft = document.getElementById('topbar-left');
      const topRight = document.getElementById('topbar-right');
      const footer = document.getElementById('global-footer');

      topLeft.innerHTML = '';
      topRight.innerHTML = '';
      footer.innerHTML = '';

      if (state.screen === 'MENU') {
        viewport.innerHTML = renderMainMenu();
      } else if (state.screen === 'LOBBY') {
        topLeft.innerHTML = `<button onclick="go('MENU')" class="float-link font-eerie text-base tracking-[0.16em]">Leave</button>`;
        viewport.innerHTML = renderLobby();
      } else if (state.screen === 'LOADING') {
        viewport.innerHTML = renderLoadingAndRole();
        runLoadingSequence();
      } else if (state.screen === 'HUD') {
        viewport.innerHTML = renderHUD();
      } else if (state.screen === 'SETTINGS') {
        topLeft.innerHTML = `<button onclick="go('MENU')" class="float-link font-eerie text-base tracking-[0.16em]">Back</button>`;
        viewport.innerHTML = renderSettings();
      } else if (state.screen === 'HOW_TO_PLAY') {
        topLeft.innerHTML = `<button onclick="go('MENU')" class="float-link font-eerie text-base tracking-[0.16em]">Back</button>`;
        viewport.innerHTML = renderHowToPlay();
      }

    /* ============================================================================
       1B. HOW TO PLAY SCREEN (Minimalist Rules Over Foggy Campus)

    function renderHowToPlay() {
      const rules = [
        {
          num: 'I',
          title: 'Lobby & Roles',
          desc: '3–6 players enter the campus after curfew. Once the match begins, 1–2 players are randomly chosen in secret as Hunters while the rest become Survivors.'

        {
          num: 'II',
          title: "Survivors' Goal",
          desc: 'Explore the darkened quad, library, and halls to complete all assigned rituals quietly, then escape before time runs out or everyone is caught.'
        },
        {
          num: 'III',
          title: "Hunters' Goal",
          desc: 'Patrol the campus shadows, track down lingering footsteps, and eliminate every Survivor before the final ritual is completed.'
        },
        {
          num: 'IV',
          title: 'Survival Tips',
          desc: 'Listen closely for spatial footsteps and heartbeat cues, slip into deep architectural shadows to hide, and stick together or split tasks strategically.'

      return `
        <div class="screen-fade w-full max-w-2xl flex flex-col items-center my-auto py-4">

          <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-x-10 gap-y-6 bg-[#091324]/45 backdrop-blur-[2px] px-6 sm:px-8 py-6 border-y border-[#436b95]/25 mb-9">
            ${rules.map(r => `
              <div class="flex flex-col text-left">
                <div class="flex items-baseline gap-2.5 mb-1.5">
                  <span class="font-mono-clean text-xs tracking-[0.2em] text-[#7aa3cc]">${r.num}.</span>
                  <h3 class="font-eerie text-xl tracking-[0.12em] text-[#dce7f5] glow-teal">
                    ${r.title}
                  </h3>
                </div>
                <p class="font-serif-clean text-base sm:text-[17px] leading-relaxed tracking-[0.04em] text-[#dce7f5]/75">
                  ${r.desc}
                </p>
              </div>
            `).join('')}
          </div>

          <button onmouseenter="playChime('hover')" onclick="go('MENU')"
            class="float-link group font-eerie text-2xl tracking-[0.14em] inline-flex items-center gap-3">

            <span>Back</span>
            <span class="opacity-0 translate-x-1 group-hover:opacity-80 group-hover:translate-x-0 transition-all text-base text-[#7aa3cc]">‹</span>

    }

    function createLobby() {
      const code = Math.floor(100 + Math.random() * 900);
      state.lobby.roomCode = `AFH-${code}`;
      go('LOBBY');
    }

    function openJoinModal() {
      playChime('select');
      openModal(`
        <div class="screen-fade flex flex-col items-center">
          <div class="font-eerie text-2xl tracking-[0.14em] text-[#dce7f5] glow-mist mb-6">
            Enter Room Code
          </div>
          <input id="room-code-field" type="text" maxlength="7" value="AFH-409"
            class="w-48 bg-transparent border-b border-[#6e94b8]/55 focus:border-[#dce7f5] outline-none py-2 text-center font-mono-clean text-xl tracking-[0.25em] uppercase text-[#dce7f5] mb-8" />
          <div class="flex items-center gap-10">
            <button onmouseenter="playChime('hover')" onclick="confirmJoin()"
              class="float-link font-eerie text-xl tracking-[0.14em]">
              Join
            </button>
            <button onmouseenter="playChime('hover')" onclick="closeModal()"
              class="float-link font-eerie text-xl tracking-[0.14em] opacity-70">
              Back
            </button>
          </div>
        </div>
      `);
    }

    function confirmJoin() {
      const val = (document.getElementById('room-code-field')?.value || 'AFH-409').trim().toUpperCase();
      if (val.length >= 3) state.lobby.roomCode = val;
      closeModal();
      go('LOBBY');
    }

    function openQuitModal() {
      playChime('select');
      openModal(`
        <div class="screen-fade flex flex-col items-center">
          <div class="font-eerie text-2xl tracking-[0.14em] text-[#dce7f5] glow-mist mb-6">
            Leave the Fog?
          </div>
          <div class="flex items-center gap-10">
            <button onmouseenter="playChime('hover')" onclick="closeModal()"
              class="float-link font-eerie text-xl tracking-[0.14em]">
              Stay
            </button>
          </div>
        </div>
      `);
    }

    /* ============================================================================
       2. ULTRA-MINIMAL LOBBY SCREEN (Only Room Code, Player Rows, Ready/Start)
    ============================================================================ */
    function renderLobby() {
      const players = state.lobby.players;
      const canStart = players.length >= 3 && players.length <= 6;
      const self = players.find(p => p.isSelf);

      // Render 6 clean minimalist rows without boxes or extra metadata
      let rowsHTML = '';
      for (let i = 0; i < 6; i++) {
        const p = players[i];
        if (p) {
          rowsHTML += `
            <div class="flex items-center justify-between py-2.5 border-b border-[#436b95]/22">
              <div class="flex items-center gap-3.5">
                <span class="w-1.5 h-1.5 rounded-full ${p.ready ? 'bg-[#7aa3cc] shadow-[0_0_8px_#7aa3cc]' : 'bg-[#436b95]/40'}"></span>
                <span class="font-serif-clean text-lg tracking-[0.1em] text-[#dce7f5]">${p.name}</span>
              </div>
              <div class="flex items-center gap-4">
                <span class="text-xs tracking-[0.18em] uppercase ${p.ready ? 'text-[#6e94b8]' : 'text-[#436b95]/60'}">
                  ${p.ready ? 'Ready' : 'Waiting'}
                </span>
                ${!p.isSelf ? `
                  <button onclick="kickPlayer(${p.id})" class="text-xs text-[#436b95] hover:text-[#dce7f5] transition" title="Remove">
                    ✕
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        } else {
          rowsHTML += `
            <div class="flex items-center justify-between py-2.5 border-b border-[#436b95]/12 opacity-35">
              <div class="flex items-center gap-3.5">
                <span class="w-1.5 h-1.5 rounded-full bg-[#436b95]/30"></span>
                <span class="font-serif-clean italic text-base tracking-[0.12em] text-[#6e94b8]">Empty</span>
              </div>
            </div>
          `;
        }
      }

      return `
        <div class="screen-fade w-full max-w-md flex flex-col items-center my-auto pb-8">
          <!-- Minimal Room Code Header -->
          <button onclick="copyCode()" class="group flex flex-col items-center mb-8">
            <span class="text-[10px] tracking-[0.3em] uppercase text-[#8cb2d6]/85 mb-1">Room Code</span>
            <span class="font-mono-clean text-xl tracking-[0.28em] text-[#edf4fc] glow-teal group-hover:glow-mist transition">
              ${state.lobby.roomCode}
            </span>
            <span class="w-24 h-[1px] mt-2 bg-gradient-to-r from-transparent via-[#8cb2d6]/50 to-transparent"></span>
          </button>

          <!-- Clean Player List (3–6 slots) -->
          <div class="w-full mb-8">
            ${rowsHTML}
          </div>

          <!-- Discrete Prototype Slot Adjuster -->
          <div class="flex items-center gap-6 mb-9 text-xs tracking-[0.18em] uppercase text-[#6e94b8]/75">
            <button onclick="addBot()" ${players.length >= 6 ? 'disabled' : ''}
              class="hover:text-[#dce7f5] disabled:opacity-25 transition">
              + Add Player
            </button>
            <span class="opacity-30">|</span>
            <button onclick="removeLastBot()" ${players.length <= 1 ? 'disabled' : ''}
              class="hover:text-[#dce7f5] disabled:opacity-25 transition">
              - Remove
            </button>
          </div>

          <!-- Floating Primary Actions -->
          <div class="flex items-center gap-12">
            <button onmouseenter="playChime('hover')" onclick="toggleReady()"
              class="float-link font-eerie text-2xl tracking-[0.14em]">
              ${self?.ready ? 'Unready' : 'Ready'}
            </button>

            <button onmouseenter="playChime('hover')" onclick="beginMatch()" ${!canStart ? 'disabled' : ''}
              class="float-link font-eerie text-2xl tracking-[0.14em] ${canStart ? 'text-[#dce7f5] glow-mist' : 'opacity-25 pointer-events-none'}">
              Start
            </button>
          </div>
        </div>
      `;
    }

    function copyCode() {
      playChime('select');
      if (navigator.clipboard) navigator.clipboard.writeText(state.lobby.roomCode).catch(() => {});
      showToast('Code Copied');
    }

    function addBot() {
      if (state.lobby.players.length >= 6) return;
      playChime('hover');
      const used = state.lobby.players.map(p => p.name);
      const name = state.lobby.extraNames.find(n => !used.includes(n)) || `Shade ${state.lobby.players.length + 1}`;
      state.lobby.players.push({ id: Date.now(), name, isSelf: false, ready: true, role: null, alive: true });
      render();
    }

    function removeLastBot() {
      if (state.lobby.players.length <= 1) return;
      playChime('hover');
      state.lobby.players.pop();
      render();
    }

    function kickPlayer(id) {
      playChime('hover');
      state.lobby.players = state.lobby.players.filter(p => p.id !== id);
      render();
    }

    function toggleReady() {
      playChime('select');
      const self = state.lobby.players.find(p => p.isSelf);
      if (self) self.ready = !self.ready;
      render();
    }

    /* ============================================================================
       3. MINIMAL LOADING & ROLE REVEAL SCREEN
    ============================================================================ */
    function beginMatch() {
      const players = state.lobby.players;
      if (players.length < 3) return;

      // Random assignment: 2 Hunters if 5-6 players, 1 Hunter if 3-4 players
      const hunterCount = players.length >= 5 ? 2 : 1;
      const order = players.map((_, i) => i).sort(() => Math.random() - 0.5);
      const hunters = new Set(order.slice(0, hunterCount));

      players.forEach((p, idx) => {
        p.role = hunters.has(idx) ? 'HUNTER' : 'SURVIVOR';
        p.alive = true;
      });

      const self = players.find(p => p.isSelf);
      state.match.assignedRole = self.role;
      state.match.hudViewRole = self.role;
      state.match.tasksCompleted = 2;
      state.match.hunterNear = false;
      state.match.outcome = null;

      go('LOADING');
    }

    function renderLoadingAndRole() {
      const isHunter = state.match.assignedRole === 'HUNTER';

      return `
        <div class="screen-fade flex flex-col items-center justify-center text-center my-auto pb-10">
          <!-- Phase 1: Vertical Glowing Line + Loading... -->
          <div id="load-stage" class="flex flex-col items-center">
            <div class="w-[1px] h-28 bg-[#436b95]/30 overflow-hidden mb-5">
              <div id="load-line" class="w-full bg-[#dce7f5] shadow-[0_0_10px_#dce7f5] transition-all duration-1000" style="height: 10%;"></div>
            </div>
            <div class="font-eerie italic text-lg tracking-[0.18em] text-[#6e94b8]">
              ... Loading ...
            </div>
          </div>

          <!-- Phase 2: Pure Role Reveal -->
          <div id="reveal-stage" class="hidden flex-col items-center">
            <div class="text-xs tracking-[0.34em] uppercase text-[#8cb2d6] mb-3">
              You Are
            </div>
            <h2 class="font-eerie text-5xl sm:text-7xl tracking-[0.22em] uppercase ${isHunter ? 'text-[#9e242e] glow-crimson' : 'text-[#edf4fc] glow-mist'} mb-3 font-normal">
              ${isHunter ? 'Hunter' : 'Survivor'}
            </h2>
            <div class="w-36 h-[1px] mb-4 bg-gradient-to-r from-transparent ${isHunter ? 'via-[#9e242e]/70' : 'via-[#8cb2d6]/65'} to-transparent"></div>
            <p class="font-serif-clean italic text-lg text-[#edf4fc]/85 tracking-wider mb-10">
              ${isHunter ? 'Eliminate them before the rituals finish.' : 'Complete the rituals and survive.'}
            </p>
            <button onmouseenter="playChime('hover')" onclick="go('HUD')"
              class="float-link font-eerie text-2xl tracking-[0.16em]">
              Enter
            </button>
          </div>
        </div>
      `;
    }

    function runLoadingSequence() {
      setTimeout(() => {
        const line = document.getElementById('load-line');
        if (line) line.style.height = '100%';
      }, 80);

      setTimeout(() => {
        const loadStage = document.getElementById('load-stage');
        const revealStage = document.getElementById('reveal-stage');
        if (loadStage && revealStage) {
          loadStage.classList.add('hidden');
          revealStage.classList.remove('hidden');
          revealStage.classList.add('flex', 'screen-fade');
          playChime(state.match.assignedRole === 'HUNTER' ? 'hunter' : 'select');
        }
      }, 1050);
    }

    /* ============================================================================
       4. BARE-MINIMUM IN-GAME HUD
    ============================================================================ */
    function renderHUD() {
      const isHunter = state.match.hudViewRole === 'HUNTER';
      const survivors = state.lobby.players.filter(p => p.role === 'SURVIVOR');
      const aliveCount = survivors.filter(p => p.alive).length;

      const vignette = document.getElementById('danger-vignette');
      if (vignette) vignette.style.opacity = state.match.hunterNear && !isHunter ? '1' : '0';

      // Task Dots (for Survivor) or Target Dots (for Hunter)
      const dotsHTML = isHunter
        ? survivors.map(s => `
            <span class="w-2.5 h-2.5 rounded-full transition-all ${s.alive ? 'bg-[#8f242c] shadow-[0_0_8px_#8f242c]' : 'bg-[#436b95]/25'}"></span>
          `).join('')
        : Array.from({ length: state.match.tasksTotal }).map((_, idx) => `
            <span class="w-2.5 h-2.5 rounded-full transition-all ${idx < state.match.tasksCompleted ? 'bg-[#dce7f5] shadow-[0_0_8px_#dce7f5]' : 'bg-[#436b95]/30'}"></span>
          `).join('');

      // Outcome Overlay
      if (state.match.outcome) {
        const winSurvivors = state.match.outcome === 'SURVIVORS_WIN';
        return `
          <div class="screen-fade flex flex-col items-center text-center my-auto pb-10">
            <h2 class="font-eerie text-4xl sm:text-6xl tracking-[0.18em] ${winSurvivors ? 'text-[#dce7f5] glow-mist' : 'text-[#8f242c] glow-crimson'} mb-8 font-normal">
              ${winSurvivors ? 'Survivors Escaped' : 'Hunters Prevailed'}
            </h2>
            <button onmouseenter="playChime('hover')" onclick="go('LOBBY')"
              class="float-link font-eerie text-2xl tracking-[0.14em]">
              Return to Lobby
            </button>
          </div>
        `;
      }

      return `
        <div class="screen-fade w-full h-[78vh] flex flex-col justify-between">
          <!-- Top Row: Minimal Dots Left, Role + Menu Right -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="text-xs tracking-[0.22em] uppercase text-[#6e94b8]">
                ${isHunter ? `Targets (${aliveCount})` : `Tasks (${state.match.tasksCompleted}/${state.match.tasksTotal})`}
              </span>
              <div class="flex items-center gap-2">
                ${dotsHTML}
              </div>
            </div>

            <div class="flex items-center gap-6">
              <span class="font-eerie text-lg tracking-[0.16em] ${isHunter ? 'text-[#8f242c]' : 'text-[#dce7f5]'}">
                ${isHunter ? 'Hunter' : 'Survivor'}
              </span>
              <button onclick="go('LOBBY')" class="float-link font-eerie text-base tracking-[0.14em]">
                Menu
              </button>
            </div>
          </div>

          <!-- Center Subtle Focal Dot -->
          <div class="my-auto flex flex-col items-center pointer-events-none">
            <div class="w-1 h-1 rounded-full bg-[#dce7f5]/40"></div>
          </div>

          <!-- Bottom Row: Single Contextual Prompt + Discrete Prototype Controls -->
          <div class="flex flex-col items-center gap-5">
            <div class="font-serif-clean text-base tracking-[0.2em] text-[#dce7f5]/85 glow-teal">
              ${isHunter ? '[LMB] Strike' : state.match.hunterNear ? 'Hide — Footsteps Near' : '[E] Complete Task'}
            </div>

            <!-- Discrete Bottom Prototype Switcher -->
            <div class="flex flex-wrap items-center justify-center gap-5 text-[11px] tracking-[0.18em] uppercase text-[#6e94b8]/65 pt-2 border-t border-[#436b95]/18">
              <button onclick="toggleHudView()" class="hover:text-[#dce7f5] transition">
                View: ${isHunter ? 'Hunter' : 'Survivor'}
              </button>
              <span>·</span>
              <button onclick="advanceTask()" class="hover:text-[#dce7f5] transition">
                + Task
              </button>
              <span>·</span>
              <button onclick="toggleNear()" class="hover:text-[#dce7f5] transition">
                ${state.match.hunterNear ? 'Clear Danger' : 'Hunter Near'}
              </button>
              <span>·</span>
              <button onclick="eliminateOne()" class="hover:text-[#8f242c] transition">
                Eliminate Target
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleHudView() {
      playChime('hover');
      state.match.hudViewRole = state.match.hudViewRole === 'SURVIVOR' ? 'HUNTER' : 'SURVIVOR';
      render();
    }

    function advanceTask() {
      playChime('select');
      if (state.match.tasksCompleted < state.match.tasksTotal) {
        state.match.tasksCompleted++;
        if (state.match.tasksCompleted >= state.match.tasksTotal) {
          state.match.outcome = 'SURVIVORS_WIN';
        }
        render();
      }
    }

    function toggleNear() {
      playChime('hover');
      state.match.hunterNear = !state.match.hunterNear;
      render();
    }

    function eliminateOne() {
      playChime('hunter');
      const survivors = state.lobby.players.filter(p => p.role === 'SURVIVOR' && p.alive);
      if (survivors.length > 0) {
        survivors[survivors.length - 1].alive = false;
        if (survivors.length === 1) {
          state.match.outcome = 'HUNTERS_WIN';
        }
        render();
      }
    }

    /* ============================================================================
       5. MINIMALIST BORDERLESS SETTINGS SCREEN (AUDIO ONLY)
    ============================================================================ */
    function renderSettings() {
      const vol = state.settings.audio.volume;

      return `
        <div class="screen-fade w-full max-w-md flex flex-col items-center text-center my-auto pb-8">
          <h2 class="font-eerie text-3xl sm:text-4xl tracking-[0.18em] text-[#dce7f5] glow-mist mb-10 font-normal">
            Audio
          </h2>

          <div class="w-full px-2">
            <div class="flex items-center justify-between text-xs tracking-[0.22em] uppercase text-[#dce7f5]/90 mb-5">
              <span>Master Volume</span>
              <span id="volume-value-label" class="font-mono-clean text-sm text-[#7aa3cc]">${vol}%</span>
            </div>

            <!-- Interactive Horizontal Line & Sliding Volume Dot -->
            <div id="volume-track-container"
              onmousedown="startVolumeDrag(event)"
              ontouchstart="startVolumeDrag(event)"
              class="relative w-full h-8 flex items-center cursor-pointer touch-none group">
              <!-- Base Track Line -->
              <div class="w-full h-[2px] bg-[#6e94b8]/25 relative">
                <!-- Filled Active Line -->
                <div id="volume-fill-line"
                  class="h-full bg-[#dce7f5]/80 shadow-[0_0_8px_rgba(220,231,245,0.45)]"
                  style="width: ${vol}%;"></div>
              </div>

              <!-- Circular Sliding Volume Dot -->
              <div id="volume-slider-dot"
                class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-[#dce7f5] shadow-[0_0_12px_rgba(220,231,245,0.85)] group-hover:scale-125 transition-transform duration-150 pointer-events-none"
                style="left: ${vol}%;"></div>

              <!-- Native Range Input for Keyboard Accessibility & Sync -->
              <input id="volume-range-input" type="range" min="0" max="100" value="${vol}"
                aria-label="Master Volume"
                oninput="updateVolumeValue(this.value)"
                class="sr-only" />
            </div>
          </div>

          <div class="mt-14 flex items-center gap-12">
            <button onmouseenter="playChime('hover')" onclick="saveAndExit()"
              class="float-link font-eerie text-xl tracking-[0.14em] text-[#dce7f5]">
              Save &amp; Close
            </button>
            <button onmouseenter="playChime('hover')" onclick="go('MENU')"
              class="float-link font-eerie text-xl tracking-[0.14em] opacity-70">
              Back
            </button>
          </div>
        </div>
      `;
    }

    let isDraggingVolume = false;

    function updateVolumeValue(val) {
      const clamped = Math.max(0, Math.min(100, Math.round(Number(val))));
      state.settings.audio.volume = clamped;

      const label = document.getElementById('volume-value-label');
      const fill = document.getElementById('volume-fill-line');
      const dot = document.getElementById('volume-slider-dot');
      const range = document.getElementById('volume-range-input');

      if (label) label.textContent = `${clamped}%`;
      if (fill) fill.style.width = `${clamped}%`;
      if (dot) dot.style.left = `${clamped}%`;
      if (range && Number(range.value) !== clamped) range.value = clamped;
    }

    function applyVolumeFromClientX(clientX) {
      const track = document.getElementById('volume-track-container');
      if (!track) return;
      const rect = track.getBoundingClientRect();
      if (rect.width <= 0) return;
      const ratio = (clientX - rect.left) / rect.width;
      updateVolumeValue(ratio * 100);
    }

    function startVolumeDrag(e) {
      isDraggingVolume = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      applyVolumeFromClientX(clientX);
    }

    window.addEventListener('mousemove', (e) => {
      if (!isDraggingVolume) return;
      applyVolumeFromClientX(e.clientX);
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDraggingVolume || !e.touches.length) return;
      applyVolumeFromClientX(e.touches[0].clientX);
    }, { passive: true });

    window.addEventListener('mouseup', () => {
      if (isDraggingVolume) {
        isDraggingVolume = false;
        playChime('hover');
      }
    });

    window.addEventListener('touchend', () => {
      if (isDraggingVolume) {
        isDraggingVolume = false;
        playChime('hover');
      }
    });

    function saveAndExit() {
      playChime('select');
      showToast('Settings Saved');
      go('MENU');
    }

    /* ============================================================================
       DRIFTING MIST & FINE RAIN ATMOSPHERE CANVAS
    ============================================================================ */
    function initAtmosphere() {
      const canvas = document.getElementById('atmosphere-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      const drops = Array.from({ length: 55 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        len: Math.random() * 14 + 6,
        vy: Math.random() * 2.2 + 1.4,
        vx: -0.35,
        alpha: Math.random() * 0.18 + 0.05
      }));

      const fogWisps = Array.from({ length: 8 }, () => ({
        x: Math.random() * w,
        y: h * (0.45 + Math.random() * 0.45),
        r: Math.random() * 220 + 140,
        vx: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.06 + 0.02
      }));

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      function loop() {
        ctx.clearRect(0, 0, w, h);

        // Soft drifting midnight-blue mist clouds
        for (const f of fogWisps) {
          f.x += f.vx;
          if (f.x < -f.r) f.x = w + f.r;
          if (f.x > w + f.r) f.x = -f.r;

          const grad = ctx.createRadialGradient(f.x, f.y, 10, f.x, f.y, f.r);
          grad.addColorStop(0, `rgba(110, 148, 184, ${f.alpha})`);
          grad.addColorStop(1, 'rgba(9, 19, 36, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Subtle cold blue-white drizzle strokes (like image_0fe1b7.jpg)
        ctx.lineWidth = 1;
        for (const d of drops) {
          d.x += d.vx;
          d.y += d.vy;
          if (d.y > h) {
            d.y = -20;
            d.x = Math.random() * w;
          }
          ctx.strokeStyle = `rgba(175, 202, 232, ${d.alpha})`;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.vx * 3, d.y + d.len);
          ctx.stroke();
        }

        requestAnimationFrame(loop);
      }
      loop();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('modal-backdrop');
        if (!modal.classList.contains('hidden')) {
          closeModal();
          return;
        }
        if (state.screen !== 'MENU') go('MENU');
      }
    });

    window.onload = function () {
      initAtmosphere();
      render();
    };
  </script>
</body>
</html>
