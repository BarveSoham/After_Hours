  <style>
    :root {

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;

      color: var(--text-bone);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    }

    .font-haunted {
      font-family: 'Henny Penny', 'IM Fell English', cursive;
      font-weight: 700;
      -webkit-text-stroke: 2.5px #edf4fc;
      paint-order: stroke fill;
    }

    /* High-Contrast Painterly & Engraved Glows */
    .glow-mist {
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.95),
        0 0 18px rgba(237, 244, 252, 0.72),
        0 0 42px rgba(140, 178, 214, 0.55);
    }

    .glow-teal {
      text-shadow:
        0 1px 6px rgba(2, 5, 12, 0.9),
        0 0 14px rgba(143, 184, 224, 0.65);
    }

    .glow-crimson {
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.95),
        0 0 22px rgba(158, 36, 46, 0.85),
        0 0 46px rgba(158, 36, 46, 0.45);
    }

    /* Floating Menu Links with Subtle Engraved Underline Accent */
    .float-link {
      position: relative;
      color: rgba(237, 244, 252, 0.84);
      text-shadow: 0 2px 8px rgba(2, 5, 12, 0.92);
      transition: all 0.25s ease;
      letter-spacing: 0.16em;
    }

    .float-link::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(237, 244, 252, 0.75), transparent);
      transform: translateX(-50%);
      transition: width 0.28s ease;
    }

    .float-link:hover,
    .float-link:focus {
      color: #ffffff;
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.98),
        0 0 16px rgba(237, 244, 252, 0.85),
        0 0 32px rgba(140, 178, 214, 0.6);
      transform: translateY(-1px);
    }

    .float-link:hover::after,
    .float-link:focus::after {
      width: 85%;
    }

    /* Subtle Fade Entrance */
    @keyframes mistFadeIn {
      from {
        opacity: 0;
        filter: blur(3px);
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .screen-fade {
      animation: mistFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Gentle Continuous Title Bobbing */
    @keyframes titleBob {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .title-bob {
      animation: titleBob 4.2s ease-in-out infinite;
      will-change: transform;
    }
  </style>

  <script type="module">
    import { io } from 'socket.io-client';

    const socket = io();

    const urlParams = new URLSearchParams(window.location.search);
    const paramRoom = urlParams.get('room');
    const paramScreen = urlParams.get('screen');
    const paramName = urlParams.get('name');

    const storedName = paramName || localStorage.getItem('afterHoursPlayerName') || 'Wanderer';
    if (paramName) {
      localStorage.setItem('afterHoursPlayerName', paramName.slice(0, 16));
    }

    const state = {
      screen: (paramScreen === 'LOBBY' && paramRoom) ? 'LOBBY' : 'MENU',
      playerName: storedName.slice(0, 16),
      lobby: {
        roomCode: paramRoom ? paramRoom.toUpperCase() : 'AFH-409',
        isHost: true,
        players: [],
        extraNames: ['Soren', 'Isolde', 'Rowan', 'Evelyn']
      },
      assignedRole: 'SURVIVOR'
    };

    socket.on('connect', () => {
      console.log(`[Socket.io Lobby] Connected! Socket ID: ${socket.id}`);
      if (state.screen === 'LOBBY' && state.lobby.roomCode) {
        socket.emit('joinRoom', {
          name: state.playerName,
          roomCode: state.lobby.roomCode,
          asLobby: true
        });
      }
    });

    socket.on('connect_error', (err) => {
      console.warn('[Socket.io Lobby] Connection warning:', err.message);
    });

    socket.on('lobbyRosterUpdate', (data) => {
      state.lobby.roomCode = data.roomCode;
      state.lobby.isHost = (socket.id === data.hostId);
      state.lobby.players = data.players.map(p => ({
        id: p.id,
        name: p.name,
        isSelf: (p.id === socket.id),
        ready: !!p.ready,
        role: p.role || null
      }));
      if (state.screen === 'LOBBY') {
        render();
      }
    });

    socket.on('kickedFromLobby', () => {
      showToast('Kicked from Chamber');
      go('MENU');
    });

    socket.on('commenceDescent', (data) => {
      playChime('select');
      showToast('Descending into the Archives...');
      setTimeout(() => {
        window.location.href = `/game.html?room=${encodeURIComponent(data.roomCode)}&name=${encodeURIComponent(state.playerName)}`;
      }, 350);
    });

    let audioCtx = null;

    function playChime(type = 'hover') {
      try {
        const savedVol = Number(localStorage.getItem('afterHoursVolume') ?? 70);
        const vol = savedVol / 100;
        if (vol <= 0) return;

        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (type === 'hunter') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.45);
          gain.gain.setValueAtTime(0.08 * vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);
        } else if (type === 'select') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.16);
          gain.gain.setValueAtTime(0.06 * vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(360, now + 0.08);
          gain.gain.setValueAtTime(0.03 * vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      } catch (e) {}
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.innerHTML = `
        <div class="screen-fade px-5 py-2 bg-[#091324]/85 border border-[#436b95]/35 text-xs tracking-[0.25em] uppercase text-[#dce7f5] glow-teal">
          ${message}
        </div>
      `;
      setTimeout(() => {
        if (container) container.innerHTML = '';
      }, 2000);
    }

    function go(screenName) {
      playChime('select');
      if (state.screen === 'LOBBY' && screenName === 'MENU') {
        if (socket && socket.connected) {
          socket.emit('leaveRoom');
        }
        try {
          window.history.replaceState({}, document.title, window.location.pathname);
        } catch (_) {}
      }
      state.screen = screenName;
      render();
    }

    function render() {
      const viewport = document.getElementById('app-viewport');
      const topLeft = document.getElementById('topbar-left');
      topLeft.innerHTML = '';

      if (state.screen === 'MENU') {
        viewport.innerHTML = renderMainMenu();
      } else if (state.screen === 'JOIN_LOBBY') {
        topLeft.innerHTML = `<button onclick="go('MENU')" class="float-link font-eerie text-2xl sm:text-3xl tracking-[0.16em]">Back</button>`;
        viewport.innerHTML = renderJoinLobby();
        setTimeout(() => {
          const input = document.getElementById('room-code-field');
          if (input) input.focus();
        }, 50);
      } else if (state.screen === 'LOBBY') {
        topLeft.innerHTML = `<button onclick="go('MENU')" class="float-link font-eerie text-2xl sm:text-3xl tracking-[0.16em]">Leave</button>`;
        viewport.innerHTML = renderLobby();
      } else if (state.screen === 'ROLE_REVEAL') {
        topLeft.innerHTML = `<button onclick="go('LOBBY')" class="float-link font-eerie text-2xl sm:text-3xl tracking-[0.16em]">Lobby</button>`;
        viewport.innerHTML = renderRoleReveal();
      }
    }

    /* ============================================================================

            </h1>

          <nav class="flex flex-col items-center gap-5">

              class="float-link group font-eerie text-2xl sm:text-[26px] tracking-[0.12em] inline-flex items-center gap-3 text-[#dce7f5] glow-mist">
              <span class="opacity-0 -translate-x-1 group-hover:opacity-80 group-hover:translate-x-0 transition-all text-base text-[#7aa3cc]">›</span>

            </button>

            <a href="how-to-play.html" onmouseenter="playChime('hover')" onclick="playChime('select')"
              class="float-link group font-eerie text-2xl sm:text-[26px] tracking-[0.12em] inline-flex items-center gap-3">
              <span class="opacity-0 -translate-x-1 group-hover:opacity-80 group-hover:translate-x-0 transition-all text-base text-[#7aa3cc]">›</span>
              <span>How to Play</span>

            </a>

            <a href="settings.html" onmouseenter="playChime('hover')" onclick="playChime('select')"
              class="float-link group font-eerie text-2xl sm:text-[26px] tracking-[0.12em] inline-flex items-center gap-3">

    /* ============================================================================
       2. JOIN LOBBY SCREEN
    ============================================================================ */
    function renderJoinLobby() {
      return `
        <div class="screen-fade w-full max-w-md flex flex-col items-center text-center my-auto pb-12">
          <div class="text-[10px] tracking-[0.32em] uppercase text-[#6e94b8]/80 mb-2">
            After Curfew
          </div>
          <h2 class="font-eerie text-3xl sm:text-5xl tracking-[0.18em] text-[#dce7f5] glow-mist mb-8 font-normal">
            Join Lobby
          </h2>

          <label for="alias-field" class="text-xs tracking-[0.26em] uppercase text-[#8cb2d6]/85 mb-2">
            Your Alias
          </label>
          <input id="alias-field" type="text" maxlength="14" value="${state.playerName}"
            class="w-56 bg-transparent border-b border-[#6e94b8]/55 focus:border-[#dce7f5] outline-none py-2 text-center font-serif-clean text-xl tracking-[0.15em] text-[#edf4fc] mb-6" />

          <label for="room-code-field" class="text-xs tracking-[0.26em] uppercase text-[#8cb2d6]/85 mb-2">
            Enter Room Code
          </label>
          <input id="room-code-field" type="text" maxlength="8" value="${state.lobby.roomCode}"
            onkeydown="if(event.key==='Enter') confirmJoin()"
            class="w-56 bg-transparent border-b border-[#6e94b8]/55 focus:border-[#dce7f5] outline-none py-2.5 text-center font-mono-clean text-2xl tracking-[0.28em] uppercase text-[#edf4fc] glow-teal mb-10" />

          <div class="flex items-center gap-12">
            <button onmouseenter="playChime('hover')" onclick="confirmJoin()"
              class="float-link font-eerie text-2xl tracking-[0.14em] text-[#dce7f5] glow-mist">
              Join
            </button>
            <button onmouseenter="playChime('hover')" onclick="go('MENU')"
              class="float-link font-eerie text-2xl tracking-[0.14em] opacity-70">
              Back
            </button>
          </div>
        </div>
      `;
    }

    function createLobby() {
      const code = 'AFH-' + Math.floor(100 + Math.random() * 900);
      state.lobby.roomCode = code;
      state.lobby.isHost = true;
      socket.emit('joinRoom', { name: state.playerName, roomCode: code });
      go('LOBBY');
    }

    function confirmJoin() {
      const aliasInput = document.getElementById('alias-field');
      if (aliasInput && aliasInput.value.trim()) {
        state.playerName = aliasInput.value.trim().slice(0, 16);
        localStorage.setItem('afterHoursPlayerName', state.playerName);
      }
      const val = (document.getElementById('room-code-field')?.value || 'AFH-409').trim().toUpperCase();
      if (val.length < 3) {
        showToast('Enter Valid Code');
        return;
      }
      state.lobby.roomCode = val;
      state.lobby.isHost = false;
      socket.emit('joinRoom', { name: state.playerName, roomCode: val });
      go('LOBBY');
    }

    /* ============================================================================
       3. CREATE / ACTIVE LOBBY SCREEN
    ============================================================================ */
    function renderLobby() {
      const players = state.lobby.players;
      const canStart = players.length >= 1 && players.length <= 6;
      const self = players.find(p => p.isSelf);

      let rowsHTML = '';
      for (let i = 0; i < 6; i++) {
        const p = players[i];
        if (p) {
          rowsHTML += `
            <div class="flex items-center justify-between py-2.5 border-b border-[#436b95]/22">
              <div class="flex items-center gap-3.5">
                <span class="w-1.5 h-1.5 rounded-full ${p.ready ? 'bg-[#7aa3cc] shadow-[0_0_8px_#7aa3cc]' : 'bg-[#436b95]/40'}"></span>
                <span class="font-serif-clean text-lg tracking-[0.1em] text-[#dce7f5]">${p.name}${p.isSelf ? ' (You)' : ''}</span>
              </div>
              <div class="flex items-center gap-4">
                <span class="text-xs tracking-[0.18em] uppercase ${p.ready ? 'text-[#6e94b8]' : 'text-[#436b95]/60'}">
                  ${p.ready ? 'Ready' : 'Waiting'}
                </span>
                ${(!p.isSelf && state.lobby.isHost) ? `
                  <button onclick="kickPlayer('${p.id}')" class="text-xs text-[#436b95] hover:text-[#dce7f5] transition" title="Remove">
                    ✕
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        } else {
          rowsHTML += `
            <div class="flex items-center justify-between py-2.5 border-b border-[#436b95]/12 opacity-35">
              <div class="flex items-center gap-3.5">
                <span class="w-1.5 h-1.5 rounded-full bg-[#436b95]/30"></span>
                <span class="font-serif-clean italic text-base tracking-[0.12em] text-[#6e94b8]">Empty Chamber</span>
              </div>
            </div>
          `;
        }
      }

      return `
        <div class="screen-fade w-full max-w-md flex flex-col items-center my-auto pb-8">
          <button onclick="copyCode()" class="group flex flex-col items-center mb-8">
            <span class="text-[10px] tracking-[0.3em] uppercase text-[#8cb2d6]/85 mb-1">Room Cipher</span>
            <span class="font-mono-clean text-xl tracking-[0.28em] text-[#edf4fc] glow-teal group-hover:glow-mist transition">
              ${state.lobby.roomCode}
            </span>
            <span class="w-24 h-[1px] mt-2 bg-gradient-to-r from-transparent via-[#8cb2d6]/50 to-transparent"></span>
          </button>

          <div class="w-full mb-8">
            ${rowsHTML}
          </div>

          <div class="flex items-center gap-6 mb-9 text-xs tracking-[0.18em] uppercase text-[#6e94b8]/75">
            <button onclick="addBot()" ${players.length >= 6 ? 'disabled' : ''}
              class="hover:text-[#dce7f5] disabled:opacity-25 transition">
              + Add Shade
            </button>
            <span class="opacity-30">|</span>
            <button onclick="removeLastBot()" ${players.length <= 1 ? 'disabled' : ''}
              class="hover:text-[#dce7f5] disabled:opacity-25 transition">
              - Remove
            </button>
          </div>

          <div class="flex items-center gap-12">
            <button onmouseenter="playChime('hover')" onclick="toggleReady()"
              class="float-link font-eerie text-2xl tracking-[0.14em] transition-all duration-300 ${self?.ready ? '!text-white scale-105 [text-shadow:0_0_12px_#ffffff,0_0_26px_#dce7f5,0_0_48px_#8fb8e0]' : 'opacity-65'}">
              ${self?.ready ? 'Marked Ready' : 'Mark Ready'}
            </button>

            <button onmouseenter="playChime('hover')" onclick="beginMatch()" ${!canStart ? 'disabled' : ''}
              class="float-link font-eerie text-2xl tracking-[0.14em] ${canStart ? 'text-[#dce7f5] glow-mist' : 'opacity-25 pointer-events-none'}">
              Commence Match
            </button>
          </div>
        </div>
      `;
    }

    function copyCode() {
      playChime('select');
      if (navigator.clipboard) navigator.clipboard.writeText(state.lobby.roomCode).catch(() => {});
      showToast('Code Copied');
    }

    function addBot() {
      if (state.lobby.players.length >= 6) return;
      playChime('hover');
      const used = state.lobby.players.map(p => p.name);
      const name = state.lobby.extraNames.find(n => !used.includes(n)) || `Shade ${state.lobby.players.length + 1}`;
      state.lobby.players.push({ id: 'bot_' + Date.now(), name, isSelf: false, ready: true, role: null });
      render();
    }

    function removeLastBot() {
      const bots = state.lobby.players.filter(p => String(p.id).startsWith('bot_'));
      if (bots.length === 0) return;
      playChime('hover');
      const lastBot = bots[bots.length - 1];
      state.lobby.players = state.lobby.players.filter(p => p.id !== lastBot.id);
      render();
    }

    function kickPlayer(id) {
      playChime('hover');
      if (String(id).startsWith('bot_')) {
        state.lobby.players = state.lobby.players.filter(p => p.id !== id);
        render();
      } else {
        socket.emit('kickPlayer', { targetId: id });
      }
    }

    function toggleReady() {
      playChime('select');
      socket.emit('toggleReady');
      const self = state.lobby.players.find(p => p.isSelf);
      if (self) {
        self.ready = !self.ready;
        render();
      }
    }

    function beginMatch() {
      if (!state.lobby.isHost) {
        showToast('Only Host Can Commence');
        return;
      }
      playChime('select');
      showToast('Calling All Wanderers...');
      socket.emit('commenceMatchRequest');
    }

    function renderRoleReveal() {
      const isHunter = state.assignedRole === 'HUNTER';
      const targetUrl = `/game.html?room=${encodeURIComponent(state.lobby.roomCode)}&name=${encodeURIComponent(state.playerName)}&prevId=${socket.id}`;

      // Automatically transition after 3.2 seconds
      setTimeout(() => {
        if (state.screen === 'ROLE_REVEAL') {
          window.location.href = targetUrl;
        }
      }, 3200);

      return `
        <div class="screen-fade flex flex-col items-center justify-center text-center my-auto pb-10">
          <div class="text-xs tracking-[0.34em] uppercase text-[#8cb2d6] mb-3">
            You Are
          </div>
          <h2 class="font-eerie text-5xl sm:text-7xl tracking-[0.22em] uppercase ${isHunter ? 'text-[#9e242e] glow-crimson' : 'text-[#edf4fc] glow-mist'} mb-3 font-normal">
            ${isHunter ? 'Hunter' : 'Survivor'}
          </h2>
          <div class="w-36 h-[1px] mb-4 bg-gradient-to-r from-transparent ${isHunter ? 'via-[#9e242e]/70' : 'via-[#8cb2d6]/65'} to-transparent"></div>
          <p class="font-serif-clean italic text-lg text-[#edf4fc]/85 tracking-wider mb-8">
            ${isHunter ? 'Eliminate them before the rituals finish.' : 'Complete the rituals and survive.'}
          </p>
          <button onmouseenter="playChime('hover')" onclick="window.location.href='${targetUrl}'"
            class="float-link font-eerie text-2xl tracking-[0.16em] text-[#dce7f5] glow-mist mb-4">
            Enter Match
          </button>
          <button onmouseenter="playChime('hover')" onclick="go('LOBBY')"
            class="float-link font-eerie text-lg tracking-[0.16em] opacity-65">
            Return to Lobby
          </button>
        </div>
      `;
    }

    // Expose functions to window for onclick handlers
    window.go = go;
    window.createLobby = createLobby;
    window.confirmJoin = confirmJoin;
    window.copyCode = copyCode;
    window.addBot = addBot;
    window.removeLastBot = removeLastBot;
    window.kickPlayer = kickPlayer;
    window.toggleReady = toggleReady;
    window.beginMatch = beginMatch;
    window.playChime = playChime;

    /* ============================================================================
       DRIFTING MIST & FINE RAIN ATMOSPHERE CANVAS
    ============================================================================ */
    function initAtmosphere() {
      const canvas = document.getElementById('atmosphere-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      const drops = Array.from({ length: 55 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        len: Math.random() * 14 + 6,
        vy: Math.random() * 2.2 + 1.4,
        vx: -0.35,
        alpha: Math.random() * 0.18 + 0.05
      }));

      const fogWisps = Array.from({ length: 8 }, () => ({
        x: Math.random() * w,
        y: h * (0.45 + Math.random() * 0.45),
        r: Math.random() * 220 + 140,
        vx: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.06 + 0.02
      }));

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      function loop() {
        ctx.clearRect(0, 0, w, h);

        for (const f of fogWisps) {
          f.x += f.vx;
          if (f.x < -f.r) f.x = w + f.r;
          if (f.x > w + f.r) f.x = -f.r;

          const grad = ctx.createRadialGradient(f.x, f.y, 10, f.x, f.y, f.r);
          grad.addColorStop(0, `rgba(110, 148, 184, ${f.alpha})`);
          grad.addColorStop(1, 'rgba(9, 19, 36, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.lineWidth = 1;
        for (const d of drops) {
          d.x += d.vx;
          d.y += d.vy;
          if (d.y > h) {
            d.y = -20;
            d.x = Math.random() * w;
          }
          ctx.strokeStyle = `rgba(175, 202, 232, ${d.alpha})`;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.vx * 3, d.y + d.len);
          ctx.stroke();
        }

        requestAnimationFrame(loop);
      }
      loop();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.screen !== 'MENU') {
        go('MENU');
      }
    });

    window.onload = function () {
      initAtmosphere();
      if (state.screen === 'LOBBY' && state.lobby.roomCode && socket && socket.connected) {
        socket.emit('joinRoom', {
          name: state.playerName,
          roomCode: state.lobby.roomCode,
          asLobby: true
        });
      }
      render();
    };
  </script>
</body>
</html>
