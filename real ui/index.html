<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFTER HOURS — Main Menu &amp; Lobbies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Henny+Penny&family=IM+Fell+English:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-abyss: #02050c;
      --bg-deep: #071020;
      --bg-mist: #162d4d;
      --bg-slate: #244670;
      --mist-mid: #4e7cab;
      --mist-light: #8cb2d6;
      --text-bone: #edf4fc;
      --accent-teal: #8fb8e0;
      --accent-crimson: #9e242e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-abyss);
      color: var(--text-bone);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .font-eerie {
      font-family: 'IM Fell English', 'Cormorant Garamond', serif;
    }

    .font-serif-clean {
      font-family: 'Cormorant Garamond', serif;
    }

    .font-mono-clean {
      font-family: 'JetBrains Mono', monospace;
    }

    .font-haunted {
      font-family: 'Henny Penny', 'IM Fell English', cursive;
      font-weight: 700;
      -webkit-text-stroke: 2.5px #edf4fc;
      paint-order: stroke fill;
    }

    /* High-Contrast Painterly & Engraved Glows */
    .glow-mist {
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.95),
        0 0 18px rgba(237, 244, 252, 0.72),
        0 0 42px rgba(140, 178, 214, 0.55);
    }

    .glow-teal {
      text-shadow:
        0 1px 6px rgba(2, 5, 12, 0.9),
        0 0 14px rgba(143, 184, 224, 0.65);
    }

    .glow-crimson {
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.95),
        0 0 22px rgba(158, 36, 46, 0.85),
        0 0 46px rgba(158, 36, 46, 0.45);
    }

    /* Floating Menu Links with Subtle Engraved Underline Accent */
    .float-link {
      position: relative;
      color: rgba(237, 244, 252, 0.84);
      text-shadow: 0 2px 8px rgba(2, 5, 12, 0.92);
      transition: all 0.25s ease;
      letter-spacing: 0.16em;
    }

    .float-link::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(237, 244, 252, 0.75), transparent);
      transform: translateX(-50%);
      transition: width 0.28s ease;
    }

    .float-link:hover,
    .float-link:focus {
      color: #ffffff;
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.98),
        0 0 16px rgba(237, 244, 252, 0.85),
        0 0 32px rgba(140, 178, 214, 0.6);
      transform: translateY(-1px);
    }

    .float-link:hover::after,
    .float-link:focus::after {
      width: 85%;
    }

    /* Subtle Fade Entrance */
    @keyframes mistFadeIn {
      from {
        opacity: 0;
        filter: blur(3px);
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .screen-fade {
      animation: mistFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Gentle Continuous Title Bobbing */
    @keyframes titleBob {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .title-bob {
      animation: titleBob 4.2s ease-in-out infinite;
      will-change: transform;
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between">

      <rect x="0" y="260" width="1440" height="280" fill="url(#mistVeil)" />

  </div>

  <!-- MINIMAL TOP BAR -->
