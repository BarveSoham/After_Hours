<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFTER HOURS — Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-abyss: #02050c;
      --bg-deep: #071020;
      --bg-mist: #162d4d;
      --bg-slate: #244670;
      --mist-mid: #4e7cab;
      --mist-light: #8cb2d6;
      --text-bone: #edf4fc;
      --accent-teal: #8fb8e0;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-abyss);
      color: var(--text-bone);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .font-eerie {
      font-family: 'IM Fell English', 'Cormorant Garamond', serif;
    }

    .font-mono-clean {
      font-family: 'JetBrains Mono', monospace;
    }

    .glow-mist {
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.95),
        0 0 18px rgba(237, 244, 252, 0.72),
        0 0 42px rgba(140, 178, 214, 0.55);
    }

    .glow-teal {
      text-shadow:
        0 1px 6px rgba(2, 5, 12, 0.9),
        0 0 14px rgba(143, 184, 224, 0.65);
    }

    .float-link {
      position: relative;
      color: rgba(237, 244, 252, 0.84);
      text-shadow: 0 2px 8px rgba(2, 5, 12, 0.92);
      transition: all 0.25s ease;
      letter-spacing: 0.16em;
    }

    .float-link::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(237, 244, 252, 0.75), transparent);
      transform: translateX(-50%);
      transition: width 0.28s ease;
    }

    .float-link:hover,
    .float-link:focus {
      color: #ffffff;
      text-shadow:
        0 2px 10px rgba(2, 5, 12, 0.98),
        0 0 16px rgba(237, 244, 252, 0.85),
        0 0 32px rgba(140, 178, 214, 0.6);
      transform: translateY(-1px);
    }

    .float-link:hover::after,
    .float-link:focus::after {
      width: 85%;
    }

    @keyframes mistFadeIn {
      from {
        opacity: 0;
        filter: blur(3px);
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .screen-fade {
      animation: mistFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

  </div>

  <!-- TOP NAVIGATION BAR -->
  <header class="relative z-20 flex items-center justify-between px-6 sm:px-12 pt-6 min-h-[48px]">
    <a href="index.html" onmouseenter="playChime('hover')" onclick="playChime('select')"
      class="float-link font-eerie text-xl sm:text-2xl tracking-[0.16em]">
      Back
    </a>
    <div></div>
  </header>

  <!-- AUDIO-ONLY SETTINGS MAIN CONTENT -->
  <main class="relative z-10 flex-grow flex items-center justify-center px-6 sm:px-12 py-4">
    <div class="screen-fade w-full max-w-md flex flex-col items-center text-center my-auto pb-8">
      <h1 class="font-eerie text-3xl sm:text-4xl tracking-[0.18em] text-[#dce7f5] glow-mist mb-10 font-normal">
        Audio
      </h1>

      <div class="w-full px-2">
        <div class="flex items-center justify-between text-xs tracking-[0.22em] uppercase text-[#dce7f5]/90 mb-5">
          <span>Master Volume</span>
          <span id="volume-value-label" class="font-mono-clean text-sm text-[#7aa3cc]">70%</span>
        </div>

        <!-- Interactive Horizontal Line & Sliding Volume Dot -->
        <div id="volume-track-container"
          onmousedown="startVolumeDrag(event)"
          ontouchstart="startVolumeDrag(event)"
          class="relative w-full h-8 flex items-center cursor-pointer touch-none group">
          <!-- Base Track Line -->
          <div class="w-full h-[2px] bg-[#6e94b8]/25 relative">
            <!-- Filled Active Line -->
            <div id="volume-fill-line"
              class="h-full bg-[#dce7f5]/80 shadow-[0_0_8px_rgba(220,231,245,0.45)]"
              style="width: 70%;"></div>
          </div>

          <!-- Circular Sliding Volume Dot -->
          <div id="volume-slider-dot"
            class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-[#dce7f5] shadow-[0_0_12px_rgba(220,231,245,0.85)] group-hover:scale-125 transition-transform duration-150 pointer-events-none"
            style="left: 70%;"></div>

          <!-- Accessible Range Input -->
          <input id="volume-range-input" type="range" min="0" max="100" value="70"
            aria-label="Master Volume"
            oninput="updateVolumeValue(this.value)"
            class="sr-only" />
        </div>
      </div>

      <div class="mt-14 flex items-center gap-12">
        <button onmouseenter="playChime('hover')" onclick="saveSettings()"
          class="float-link font-eerie text-xl tracking-[0.14em] text-[#dce7f5]">
          Save Settings
        </button>
        <a href="index.html" onmouseenter="playChime('hover')" onclick="playChime('select')"
          class="float-link font-eerie text-xl tracking-[0.14em] opacity-70">
          Back
        </a>
      </div>
    </div>
  </main>

  <footer class="relative z-20 min-h-[44px]"></footer>

  <!-- FLOATING FEEDBACK TOAST -->
  <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

  <script>
    let volume = Number(localStorage.getItem('afterHoursVolume') ?? 70);
    let audioCtx = null;
    let isDraggingVolume = false;

    function playChime(type = 'hover') {
      try {
        const vol = volume / 100;
        if (vol <= 0) return;

        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';

        if (type === 'select') {
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.16);
          gain.gain.setValueAtTime(0.06 * vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        } else {
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(360, now + 0.08);
          gain.gain.setValueAtTime(0.03 * vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    function updateVolumeValue(val) {
      volume = Math.max(0, Math.min(100, Math.round(Number(val))));

      const label = document.getElementById('volume-value-label');
      const fill = document.getElementById('volume-fill-line');
      const dot = document.getElementById('volume-slider-dot');
      const range = document.getElementById('volume-range-input');

      if (label) label.textContent = `${volume}%`;
      if (fill) fill.style.width = `${volume}%`;
      if (dot) dot.style.left = `${volume}%`;
      if (range && Number(range.value) !== volume) range.value = volume;
    }

    function applyVolumeFromClientX(clientX) {
      const track = document.getElementById('volume-track-container');
      if (!track) return;
      const rect = track.getBoundingClientRect();
      if (rect.width <= 0) return;
      const ratio = (clientX - rect.left) / rect.width;
      updateVolumeValue(ratio * 100);
    }

    function startVolumeDrag(e) {
      isDraggingVolume = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      applyVolumeFromClientX(clientX);
    }

    window.addEventListener('mousemove', (e) => {
      if (!isDraggingVolume) return;
      applyVolumeFromClientX(e.clientX);
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDraggingVolume || !e.touches.length) return;
      applyVolumeFromClientX(e.touches[0].clientX);
    }, { passive: true });

    window.addEventListener('mouseup', () => {
      if (isDraggingVolume) {
        isDraggingVolume = false;
        playChime('hover');
      }
    });

    window.addEventListener('touchend', () => {
      if (isDraggingVolume) {
        isDraggingVolume = false;
        playChime('hover');
      }
    });

    function saveSettings() {
      localStorage.setItem('afterHoursVolume', String(volume));
      playChime('select');
      const container = document.getElementById('toast-container');
      if (container) {
        container.innerHTML = `
          <div class="screen-fade px-5 py-2 bg-[#091324]/85 border border-[#436b95]/35 text-xs tracking-[0.25em] uppercase text-[#dce7f5] glow-teal">
            Settings Saved
          </div>
        `;
      }
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 350);
    }

    function initAtmosphere() {
      const canvas = document.getElementById('atmosphere-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      const drops = Array.from({ length: 55 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        len: Math.random() * 14 + 6,
        vy: Math.random() * 2.2 + 1.4,
        vx: -0.35,
        alpha: Math.random() * 0.18 + 0.05
      }));

      const fogWisps = Array.from({ length: 8 }, () => ({
        x: Math.random() * w,
        y: h * (0.45 + Math.random() * 0.45),
        r: Math.random() * 220 + 140,
        vx: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.06 + 0.02
      }));

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      function loop() {
        ctx.clearRect(0, 0, w, h);

        for (const f of fogWisps) {
          f.x += f.vx;
          if (f.x < -f.r) f.x = w + f.r;
          if (f.x > w + f.r) f.x = -f.r;

          const grad = ctx.createRadialGradient(f.x, f.y, 10, f.x, f.y, f.r);
          grad.addColorStop(0, `rgba(110, 148, 184, ${f.alpha})`);
          grad.addColorStop(1, 'rgba(9, 19, 36, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.lineWidth = 1;
        for (const d of drops) {
          d.x += d.vx;
          d.y += d.vy;
          if (d.y > h) {
            d.y = -20;
            d.x = Math.random() * w;
          }
          ctx.strokeStyle = `rgba(175, 202, 232, ${d.alpha})`;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.vx * 3, d.y + d.len);
          ctx.stroke();
        }

        requestAnimationFrame(loop);
      }
      loop();
    }

    window.onload = function () {
      updateVolumeValue(volume);
      initAtmosphere();
    };
  </script>
</body>
